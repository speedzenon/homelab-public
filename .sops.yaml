---
# SOPS: jedna regula - kazdy *.sops.{yaml,json,env} szyfrowany W CALOSCI.
# Selektywne szyfrowanie (encrypted_regex) mialoby sens tylko z KSOPS/Flux,
# ktorych tu nie ma: pliki trafiaja do klastra przez 'sops -d | kubectl apply',
# a pelne szyfrowanie ukrywa tez nazwy/metadane (np. metadata.name Secretow).
# Istniejace pliki trzymaja wlasne ustawienia w sekcji 'sops:' - zmiana regul
# dotyczy nowych plikow i 'sops updatekeys'.
#
# DR: klucz ponizej to JEDYNY odbiorca. Dodaj drugi, offline (papier/YubiKey),
# po przecinku, i przeszyfruj: for f in $(git ls-files '*.sops.*'); do sops updatekeys -y "$f"; done
creation_rules:
  - path_regex: '\.sops\.(ya?ml|json|env)$'
    age: >-
      age1xce70l2z2l5hfuu3ynek4lrwpfa0vz4yxtjh299vq2d609azqyrqdfgke2
