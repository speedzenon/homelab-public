---
# VM uruchamiana na zadanie ('just runner-up') sama sie wylacza, gdy przez
# forgejo_runner_idle_minutes nie ma zadnego kontenera joba. Wylaczenie na czas prac:
# systemctl stop runner-idle-shutdown.timer (wraca przy nastepnym starcie VM).
- name: Skrypt i jednostki samowylaczania
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: runner-idle-shutdown.sh.j2
      dest: /usr/local/sbin/runner-idle-shutdown
      mode: "0755"
    - src: runner-idle-shutdown.service.j2
      dest: /etc/systemd/system/runner-idle-shutdown.service
      mode: "0644"
    - src: runner-idle-shutdown.timer.j2
      dest: /etc/systemd/system/runner-idle-shutdown.timer
      mode: "0644"
  loop_control:
    label: "{{ item.dest }}"
  notify: Przeladowanie systemd

- name: Zastosowanie zmian w jednostkach
  ansible.builtin.meta: flush_handlers

- name: Timer samowylaczania
  ansible.builtin.systemd:
    name: runner-idle-shutdown.timer
    enabled: "{{ forgejo_runner_idle_shutdown | bool }}"
    state: "{{ (forgejo_runner_idle_shutdown | bool) | ternary('started', 'stopped') }}"
