# Konfiguracja Ansible dla tego katalogu (ansible czyta ./ansible.cfg z biezacego
# katalogu - 'just ansible' uruchamia z infrastructure/ansible).
[defaults]
inventory = inventories/lab/hosts.yml
# roles/ - role tylko tego repo (np. forgejo_runner); role wspolne z homelab-home
# sa w kolekcji speedzenon.homelab (collections/, README kolekcji)
roles_path = roles
# Najpierw kolekcje z requirements.yml - lokalnie, poza gitem (.ansible/ w .gitignore);
# ansible-galaxy instaluje do pierwszej sciezki. Potem kolekcja z drzewa repo.
collections_path = .ansible/collections:collections
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml
forks = 5

[ssh_connection]
# Mniej polaczen SSH na zadanie (wymaga braku 'requiretty' w sudoers - Debian go nie ma)
pipelining = True
