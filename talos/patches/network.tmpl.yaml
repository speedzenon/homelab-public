# Szablon renderowany w 'just talos-apply' (envsubst). Pelna konfiguracja
# sieci w machine config = source of truth.
# Selekcja interfejsow po MAC (hardwareAddr), NIE po physical:true - wezly
# maja dwa NIC-i, wiec physical:true matchowalby OBA i konfiguracja eth0
# (adres k8s + VIP) nalozylaby sie takze na interfejs storage.
#   ${MAC}         = MAC eth0 z SOPS (przypiety na net0 przez tofu, modules/vm)
#   ${STORAGE_MAC} = deterministyczny MAC eth1 (net1, nadany w tofu z SOPS)
# eth1: adres w nieroutowanym VLAN 50, BEZ 'routes' - jedyna default-route
# zyje na eth0; interfejs storage to slepa uliczka do nas i tylko nas.
# VIP (.20) wedruje miedzy CP po elekcji etcd - aktywny PO bootstrapie.
# ${K8S_PREFIX}/${STORAGE_PREFIX} = prefiksy z cidr VLAN-ow (jak w tofu i MikroTiku).
machine:
  network:
    interfaces:
      - deviceSelector:
          hardwareAddr: "${MAC}"
        dhcp: false
        addresses:
          - ${NODE_IP}/${K8S_PREFIX}
        routes:
          - network: 0.0.0.0/0
            gateway: ${GW}
        vip:
          ip: ${VIP}
      - deviceSelector:
          hardwareAddr: "${STORAGE_MAC}"
        dhcp: false
        addresses:
          - ${STORAGE_IP}/${STORAGE_PREFIX}
        mtu: 1500
    nameservers:
      - ${DNS}
