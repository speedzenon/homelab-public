# ServiceAccount Talosa (nie Kubernetesa): Talos tworzy z niego Secret o tej
# samej nazwie z talosconfigiem ograniczonym do roli os:etcd:backup - pod moze
# tylko pobrac snapshot etcd, nic wiecej z API Talosa. Rola i namespace musza
# byc dozwolone w machine.features.kubernetesTalosAPIAccess.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
  namespace: talos-backup
spec:
  roles:
    - os:etcd:backup
