# ClusterIssuery Let's Encrypt z walidacja DNS-01 przez webhook OVH.
# - staging: testowe CA z wysokimi limitami (przegladarki mu nie ufaja) - do
#   sprawdzenia calego procesu; prod: certyfikaty zaufane wszedzie
# - bez e-maila: LE od 06.2025 nie wysyla przypomnien o wygasaniu, a repo jest
#   publiczne; konto ACME identyfikuje klucz z privateKeySecretRef (generuje go
#   cert-manager w namespace cert-manager)
# - solver 'ovh' z groupName jak w values webhooka; klucz API z Secretu
#   ovh-credentials ('just ovh-secret')
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.dawidkraska.pl
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-credentials
                key: applicationKey
              applicationSecretRef:
                name: ovh-credentials
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-credentials
                key: applicationConsumerKey
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          webhook:
            groupName: acme.dawidkraska.pl
            solverName: ovh
            config:
              endpoint: ovh-eu
              authenticationMethod: application
              applicationKeyRef:
                name: ovh-credentials
                key: applicationKey
              applicationSecretRef:
                name: ovh-credentials
                key: applicationSecret
              applicationConsumerKeyRef:
                name: ovh-credentials
                key: applicationConsumerKey
