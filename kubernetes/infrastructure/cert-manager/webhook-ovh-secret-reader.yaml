# Prawo webhooka OVH do odczytu klucza API (Secret ovh-credentials, 'just ovh-secret').
# Chart nadaje je tylko issuerom, ktore sam tworzy; nasze ClusterIssuery sa wlasne
# (bez e-maila), wiec Role jest tutaj. Least privilege: jeden Secret, tylko 'get' -
# webhook pobiera go pojedynczym Get przy kazdym wyzwaniu (k8s.go w repo webhooka).
# Nazwa ServiceAccount = releaseName z kubernetes/apps/cert-manager-webhook-ovh.yaml.
# Trivy zglasza tu KSV-0113 (MEDIUM, poza progiem CI): regula nie bierze pod uwage
# resourceNames, a dostep obejmuje dokladnie jeden Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-webhook-ovh:secret-reader
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ovh-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-webhook-ovh:secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-webhook-ovh:secret-reader
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-ovh
    namespace: cert-manager
