# Wzor dla env.sops.yaml - token GitHuba dla Renovate. Prawdziwy plik tworzy sops
# (szyfruje przy zapisie wg .sops.yaml):
#   sops kubernetes/platform/renovate/env.sops.yaml
# 'just renovate-secret' robi z niego Secret renovate-env, a chart podaje klucze
# Renovate jako zmienne srodowiskowe.
# - RENOVATE_GITHUB_COM_TOKEN: token GitHuba TYLKO do odczytu. Bez niego Renovate
#   ma 60 zapytan/h do API GitHuba (changelogi, wersje z GitHub Releases, pobieranie
#   narzedzi) i szybko w nie trafia. GitHub -> Settings -> Developer settings ->
#   Fine-grained tokens: Repository access "Public repositories", zadnych uprawnien.
#   Date waznosci tokenu wpisz do kalendarza - po wygasnieciu changelogi znikna.
# Tokenu bota w Forgejo tu NIE ma: 'just renovate-bot' generuje go i wklada prosto
# do Secretu renovate-forgejo-token. Da sie go w kazdej chwili wygenerowac od nowa,
# wiec nie musi lezec w gicie (takze po odbudowie klastra - wystarczy przepis).
# Wartosc bez cudzyslowow wewnatrz i znakow nowej linii (format KLUCZ=wartosc).
RENOVATE_GITHUB_COM_TOKEN: "<token GitHuba tylko do odczytu>"
