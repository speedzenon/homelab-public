#   do codziennej pracy osobny uzytkownik
# - password: bez cudzyslowow i znakow nowej linii (format KLUCZ=wartosc), np.
#   openssl rand -base64 33 | tr -d '\n/+='
username: forgejo-admin
password: zmien-mnie
