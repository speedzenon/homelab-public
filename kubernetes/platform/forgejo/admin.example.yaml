# Wzor dla admin.sops.yaml - konto administratora Forgejo. Prawdziwy plik tworzy
# sops (szyfruje przy zapisie wg .sops.yaml):
#   sops kubernetes/platform/forgejo/admin.sops.yaml
# Plaskie klucze: 'just forgejo-secret' robi z nich klucze Secretu forgejo-admin.
