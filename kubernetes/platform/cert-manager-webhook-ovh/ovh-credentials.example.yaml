# Wzor danych dostepowych OVH dla webhooka DNS-01 (bez wartosci).
# Prawdziwy plik obok, ovh-credentials.sops.yaml, tworzysz poleceniem:
#   sops edit kubernetes/platform/cert-manager-webhook-ovh/ovh-credentials.sops.yaml
# Plaintext istnieje wtedy tylko w edytorze; przy zapisie sops szyfruje plik
# w calosci (regula w .sops.yaml). Do klastra: 'just ovh-secret' -> Secret
# ovh-credentials w namespace cert-manager.
# Klucz API OVH: osobny dla klastra, prawa wylacznie do rekordow jednej strefy.
applicationKey: "<application key>"
applicationSecret: "<application secret>"
applicationConsumerKey: "<consumer key>"
