# Cilium na Talosie (klaster stawiany z cni=none + proxy disabled):
# - kubeProxyReplacement: Cilium przejmuje role kube-proxy (eBPF)
# - k8sServiceHost/Port: KubePrism, lokalny LB Talosa do apiservera
#   (localhost:7445) - bez tego agent traci API przy padzie CP
# - capabilities: wymagane na Talosie zamiast privileged
# - cgroup: Talos sam montuje cgroupv2, wylaczamy autoMount
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# L2 announcements: Cilium odpowiada ARP za adresy LoadBalancer z puli
# CiliumLoadBalancerIPPool (kubernetes/infrastructure/cilium-lb/).
l2announcements:
  enabled: true
# Lease'y L2 generuja staly ruch do API - podbity limit klienta (zalecenie docs)
k8sClientRateLimit:
  qps: 16
  burst: 32
# Zmiana ConfigMapy domyslnie NIE restartuje podow (ochrona CNI). W GitOps
# chcemy, by zmiana values realnie wchodzila: checksum => kontrolowany roll.
rollOutCiliumPods: true
operator:
  rollOutPods: true
# Gateway API: kontroler wbudowany w Cilium - routing L7 robi Envoy (DaemonSet
# cilium-envoy), bez osobnego ingress-controllera. Kazdy Gateway dostaje Service
# LoadBalancer -> adres z puli LB-IPAM, rozglaszany przez L2.
# CRD z kubernetes/apps/gateway-api-crds.yaml MUSZA byc w klastrze wczesniej:
# operator sprawdza je przy starcie i bez nich wylacza Gateway API az do restartu.
# Flagi jak w dokumentacji Talosa (kubernetes-guides/cni/deploying-cilium):
# - enableAlpn: Envoy negocjuje HTTP/2 przez ALPN (gRPC po TLS, GRPCRoute)
# - enableAppProtocol: protokol do backendu z pola appProtocol w Service
#   (np. kubernetes.io/h2c); ALPN i tak go wlacza, tu jawnie
# Chart wymusza przy tym bpf-lb-sock-hostns-only i bpf-lb-algorithm-annotation
# (wagi backendow w TCPRoute/UDPRoute) - stad wiecej kluczy w diffie cilium-config.
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
  # GatewayClass 'cilium' zawsze z chartu. Domyslne 'auto' po cichu ja pomija,
  # gdy w chwili renderowania nie ma CRD - wolimy glosny blad syncu (i helm
  # install na Day-1) niz "zielony" sync bez klasy.
  gatewayClass:
    create: true
