# Adopcja Cilium pod ArgoCD (multi-source):
# - zrodlo 1: chart z helm.cilium.io; targetRevision = JEDYNE zrodlo wersji
#   (just cilium-install czyta ja stad, Renovate podbija tutaj)
# - zrodlo 2: to repo jako 'ref' -> values z kubernetes/bootstrap/cilium/
# automated wlaczone po udanej adopcji (reczny App Diff + Sync na starcie).
# UWAGA: podbicie wersji CNI = roll agentow na wszystkich wezlach - review PR.
# Gateway API: wersja CRD sprzezona z Cilium (gateway-api-crds.yaml w tym katalogu).
# Gdy nowy Cilium wymaga nowszych CRD - osobny PR z CRD, zmergowany PRZED tym.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.3
      helm:
        releaseName: cilium
        valueFiles:
          - $values/kubernetes/bootstrap/cilium/values.yaml
    - repoURL: https://github.com/speedzenon/homelab-public.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
