# Wejscie HTTPS do klastra: namespace 'gateway' z Gatewayem 'internal', certyfikatem
# wildcard dla uslug wewnetrznych i trasa wspolna (przekierowanie HTTP -> HTTPS).
# Trasy aplikacji zyja przy aplikacjach (np. HTTPRoute ArgoCD z jego chartu).
# Wymaga CRD cert-managera (Certificate) i Gateway API.
#
# W namespace nie dzialaja zadne pody (Envoy Gatewaya zyje w kube-system jako
# cilium-envoy), wiec Pod Security 'restricted' niczego nie blokuje - pilnuje,
# zeby nic niespodziewanego tu nie wystartowalo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/speedzenon/homelab-public.git
    targetRevision: main
    path: kubernetes/infrastructure/gateway
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
