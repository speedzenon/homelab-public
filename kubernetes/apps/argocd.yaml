# ArgoCD zarzadza samym soba (multi-source, ten sam wzorzec co cilium.yaml):
# - zrodlo 1: chart argo/argo-cd; targetRevision = JEDYNE zrodlo wersji
#   (just argocd-install czyta ja stad, Renovate podbija tutaj)
# - zrodlo 2: to repo jako 'ref' -> values z kubernetes/bootstrap/argocd/
# automated wlaczone w #21, po adopcji z recznym App Diff + Sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.11.6
      helm:
        releaseName: argocd
        valueFiles:
          - $values/kubernetes/bootstrap/argocd/values.yaml
    - repoURL: https://github.com/speedzenon/homelab-public.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
