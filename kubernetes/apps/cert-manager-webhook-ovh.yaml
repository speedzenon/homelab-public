# Webhook DNS-01 dla OVH: cert-manager wola go, gdy Let's Encrypt kaze wystawic
# rekord TXT _acme-challenge; webhook dodaje/usuwa go przez API OVH.
# Multi-source jak cert-manager: chart z repo autora (targetRevision = JEDYNE
# zrodlo wersji, Renovate podbija tutaj) + values z tego repo.
#
# Ten sam namespace co cert-manager (tam lezy Secret ovh-credentials z
# 'just ovh-secret'). Namespace i jego etykiety PSA nalezy do Application
# cert-manager - tu celowo bez CreateNamespace/managedNamespaceMetadata, zeby
# dwie Application nie walczyly o ten sam obiekt.
#
# Gdy pod webhooka nie dziala, kubectl i ArgoCD zglaszaja niedostepne API
# acme.dawidkraska.pl/v1alpha1 (to rozszerzenie apiservera przez APIService).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-ovh
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://aureq.github.io/cert-manager-webhook-ovh/
      chart: cert-manager-webhook-ovh
      targetRevision: 0.9.19
      helm:
        releaseName: cert-manager-webhook-ovh
        valueFiles:
          - $values/kubernetes/platform/cert-manager-webhook-ovh/values.yaml
    - repoURL: https://github.com/speedzenon/homelab-public.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
