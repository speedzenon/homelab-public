# Polityka backupu: ReplicationSource-y VolSync dla wszystkich PVC w jednym
# katalogu (kubernetes/infrastructure/backup/) - ten jeden katalog pokazuje,
# co jest objete kopia. Kazdy manifest ma wlasny namespace (ten, w ktorym
# zyje PVC); sekret repozytorium tworzy 'just volsync-secret <ns> <pvc>'.
#
# Kolejnosc przy pierwszym wdrozeniu: CRD przychodza z Application 'volsync',
# a Argo nie czeka miedzy aplikacjami. SkipDryRunOnMissingResource + retry:
# sync bez CRD konczy sie bledem i jest ponawiany z backoffem, az CRD beda.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/speedzenon/homelab-public.git
    targetRevision: main
    path: kubernetes/infrastructure/backup
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: volsync-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
