---
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Cotygodniowy pełny skan: poniedziałek 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Gitleaks — pełny skan HISTORII (nie tylko bieżących plików)
  # Łapie sekrety, które były dodane i usunięte w późniejszych commitach
  # ----------------------------------------------------------
  gitleaks:
    name: Secret scanning (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION="8.30.1"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan repository history
        run: gitleaks detect --source . --verbose --redact

  # ----------------------------------------------------------
  # Trivy — skan IaC pod kątem misconfiguration
  # Na razie mało plików, ale gotowe na Terraform/k8s manifesty
  # ----------------------------------------------------------
  trivy:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
