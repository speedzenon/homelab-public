---
name: CI

# Triggery: każdy PR oraz push do main
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Minimalne uprawnienia tokena (least privilege)
permissions:
  contents: read

# Anuluj nieaktualne runy gdy pojawi się nowszy commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Pre-commit hooks — te same co lokalnie (DRY)
  # ----------------------------------------------------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # ----------------------------------------------------------
  # Walidacja tytułu PR (Conventional Commits)
  # Przy squash merge tytuł PR staje się wiadomością commita
  # ----------------------------------------------------------
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            perf
            build
            revert
