---
name: CI

# Triggery: każdy PR oraz push do main
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Minimalne uprawnienia tokena (least privilege)
permissions:
  contents: read

# Anuluj nieaktualne runy gdy pojawi się nowszy commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # Pre-commit hooks — te same co lokalnie (DRY)
  # ----------------------------------------------------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      # Dla hooka tofu-fmt (language: system)
      - name: Install OpenTofu
        run: |
          # renovate: datasource=github-releases depName=opentofu/opentofu
          TOFU_VERSION="1.13.2"
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${zip}"
          curl -fsSLO "${base}/tofu_${TOFU_VERSION}_SHA256SUMS"
          grep "  ${zip}\$" "tofu_${TOFU_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "$zip" tofu -d "$RUNNER_TEMP/tofu"
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # Na push do main checkout tworzy lokalna galaz 'main', a hook
          # no-commit-to-branch (ochrona lokalnych commitow) wywalal kazdy run.
          SKIP: no-commit-to-branch

  # ----------------------------------------------------------
  # OpenTofu validate — skladnia, typy i referencje modulow.
  # Bez sekretow i bez dostepu do PVE/MikroTika: init bez backendu,
  # providery dokladnie z .terraform.lock.hcl (-lockfile=readonly).
  # Lapie np. "Reference to undeclared resource" przed merge'em.
  # ----------------------------------------------------------
  tofu-validate:
    name: OpenTofu validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [proxmox, mikrotik]
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.module }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        run: |
          # renovate: datasource=github-releases depName=opentofu/opentofu
          TOFU_VERSION="1.13.2"
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${zip}"
          curl -fsSLO "${base}/tofu_${TOFU_VERSION}_SHA256SUMS"
          grep "  ${zip}\$" "tofu_${TOFU_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "$zip" tofu -d "$RUNNER_TEMP/tofu"
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"

      - name: tofu init
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: tofu validate
        run: tofu validate -no-color

  # ----------------------------------------------------------
  # Walidacja tytułu PR (Conventional Commits)
  # Przy squash merge tytuł PR staje się wiadomością commita
  # ----------------------------------------------------------
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            perf
            build
            revert
